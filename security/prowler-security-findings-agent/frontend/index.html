<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f9f9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI-Assisted Security Triage for AWS</title>
    <script>
      // Apply saved theme BEFORE React mounts to avoid flash of wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('soc-theme') || 'system';
          document.documentElement.classList.add(t + '-mode');
        } catch (e) { document.documentElement.classList.add('system-mode'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
