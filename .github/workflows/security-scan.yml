name: Security Scan (ASH)
# Required check on main (protect-main ruleset). Red means the scan could not run or a
# scanner did not complete. Findings are reported in the job summary and the uploaded
# artifact but do not fail the check yet: the repo has a backlog of existing findings,
# and failing on the total would block every PR for findings it did not introduce.
on:
  pull_request:
    branches: [main]
  # Manual trigger so a change to this workflow can be proven on a branch before merge.
  workflow_dispatch: {}
permissions:
  contents: read
env:
  # ASH is pinned: a new release must not change the gate under open PRs.
  # Bump both values together, on purpose, in their own PR.
  ASH_COMMIT: af1206aff596f1288ad066828058b3011de2a998   # tag v3.7.1 (CLI installed by uvx)
  ASH_TAG: v3.7.1                                        # revision cloned into the scan image
  # Scanners that must finish (PASSED or FAILED) on every run. cdk-nag and cfn-nag are
  # disabled in .ash/.ash.yaml (they need synthesized templates). If ASH adds or renames a
  # scanner, update this list when bumping ASH_COMMIT.
  REQUIRED_SCANNERS: bandit checkov detect-secrets grype npm-audit opengrep semgrep syft
jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/0.11.19/install.sh | sh
      - name: Run ASH security scan
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # --mode container        scanners run in ASH's image, which bundles the full toolset.
          #                         In local mode the non-Python scanners are MISSING.
          # --ash-revision-to-install  the image clones this tag, not the moving v3 branch.
          # --no-fail-on-findings   ASH v3 exits 2 on findings by default; findings are
          #                         report-only here (see the header). ASH then exits non-zero
          #                         only if it produced no results at all.
          # ASH ignores unknown options silently: keep to flags listed in `ash scan --help`.
          #
          # Retry only when ASH produced no results (crash, or the image build failed, e.g.
          # 429 Too Many Requests from public.ecr.aws). A completed scan is never re-run.
          for attempt in 1 2 3; do
            rm -rf .ash/output
            set +e
            uvx --from "git+https://github.com/awslabs/automated-security-helper.git@${ASH_COMMIT}" \
              ash scan \
              --mode container \
              --ash-revision-to-install "$ASH_TAG" \
              --no-fail-on-findings \
              --source-dir . \
              --output-dir .ash/output
            rc=$?
            set -e
            if [ -f .ash/output/ash_aggregated_results.json ]; then
              echo "ASH finished (exit $rc) on attempt $attempt"
              exit $rc
            fi
            echo "::warning::ASH produced no results (exit $rc) on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error::ASH produced no results after 3 attempts"
          exit 1
      - name: Check every scanner completed
        run: |
          python3 - <<'EOF'
          import json, os, sys
          path = ".ash/output/ash_aggregated_results.json"
          results = json.load(open(path)).get("scanner_results", {})
          required = os.environ["REQUIRED_SCANNERS"].split()
          bad = []
          # Required scanners must have completed: PASSED, or FAILED (= completed with findings).
          # Any other scanner may be SKIPPED (disabled in config) but never ERROR or MISSING.
          for name in sorted(set(required) | set(results)):
              status = (results.get(name) or {}).get("status", "NOT RUN")
              if name in required:
                  ok = status in ("PASSED", "FAILED")
              else:
                  ok = status not in ("ERROR", "MISSING")
              print(f"{'ok ' if ok else 'BAD'} {name}: {status}")
              if not ok:
                  bad.append(f"{name}={status}")
          if bad:
              print(f"::error::Scanners did not complete: {', '.join(bad)}")
              sys.exit(1)
          EOF
      - name: Report findings
        # Run even when a previous step failed, so the reason still reaches the job summary.
        if: always()
        run: |
          echo "## ASH Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          SUMMARY=.ash/output/reports/ash.summary.md
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ASH summary report was produced: the scan did not complete." >> "$GITHUB_STEP_SUMMARY"
            echo "See the 'Run ASH security scan' step logs and the 'ash-scan-results' artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-scan-results
          path: .ash/output/
          retention-days: 7
