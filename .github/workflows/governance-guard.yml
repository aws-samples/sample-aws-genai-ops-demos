name: Governance Guard

on:
  pull_request_target:
    branches: [main]

permissions:
  pull-requests: write
  issues: write

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      # No checkout — we only use the GitHub API to inspect the PR file list.
      # This is safe with pull_request_target because no fork code is executed.

      - name: Inspect PR and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            // Every page: listFiles returns 30 files per page by default, so a large
            // PR could otherwise hide a governance change past the first page.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // --- Governance file changes ---
            // Governance = files that define project standards or control CI/CD.
            // This includes the security-scan config (.ash/) and the Bandit config it
            // references (bandit.yaml): they govern whether/how the security scan runs,
            // so weakening them (disabling scanners, raising the severity threshold,
            // broadening ignore paths) must get the same maintainer-review gate.
            // .secrets.baseline is the detect-secrets allow-list: adding to it silences
            // the secret scan for that value. Same set as CODEOWNERS' governance lines.
            // A rename is checked under its old name too, so moving a file OUT of a
            // governance path is flagged as well.
            const isGovernance = (name) => !!name && (
              name.startsWith('.kiro/') ||
              name.startsWith('.github/') ||
              name.startsWith('.ash/') ||
              name === 'bandit.yaml' ||
              name === '.secrets.baseline'
            );
            const governanceFiles = files.filter(f =>
              isGovernance(f.filename) || isGovernance(f.previous_filename)
            );

            if (governanceFiles.length > 0) {
              const fileList = governanceFiles.map(f => `- \`${f.filename}\` (${f.status})`).join('\n');

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: ['governance-change']
                });
              } catch (e) {
                core.warning(`Could not add governance label: ${e.message}`);
              }

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `## ⚠️ Governance File Changes Detected\n\nThis PR modifies governance files that control project standards and CI/CD:\n\n${fileList}\n\n**These changes require maintainer approval.** Please ensure changes are intentional and reviewed by a repo owner.`
                });
              } catch (e) {
                core.warning(`Could not post governance comment: ${e.message}`);
              }

              core.warning('Governance files modified — maintainer review required');
            }

            // --- Deploy-exempt marker ---
            const noDeployFiles = files.filter(f =>
              f.filename.endsWith('/.no-deploy') && f.status === 'added'
            );

            if (noDeployFiles.length > 0) {
              const demoList = noDeployFiles.map(f => {
                const demo = f.filename.replace('/.no-deploy', '');
                return `- \`${demo}\``;
              }).join('\n');

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: ['deploy-exempt']
                });
              } catch (e) {
                core.warning(`Could not add deploy-exempt label: ${e.message}`);
              }

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `## ℹ️ Deploy-Exempt Demos\n\nThe following demos use a \`.no-deploy\` marker (no deployment scripts required):\n\n${demoList}\n\nPlease verify the exemption is appropriate during review.`
                });
              } catch (e) {
                core.warning(`Could not post deploy-exempt comment: ${e.message}`);
              }
            }
