scanners:
  # cdk-nag and cfn-nag evaluate SYNTHESIZED CloudFormation templates, not source.
  # In this repo-root source scan there is no `cdk synth` output, so they have no
  # legitimate CDK template to evaluate — and cdk-nag ERRORs trying to parse
  # unrelated multi-document Kubernetes / Spring / buildspec YAML
  # (ComposerError: expected a single document), which marks the whole scan
  # incomplete. Disable them here (SKIPPED, not ERROR) so the scan completes.
  #
  # Real IaC coverage is a separate follow-up: a synth stage that runs `cdk synth`
  # and scans the resulting templates. See the tracking issue.
  cdk-nag:
    enabled: false
  cfn-nag:
    enabled: false

  # Bandit: point at the repo-root bandit.yaml, which skips ONLY B101 (assert_used).
  # B101 alone is ~1,065 of ~1,240 findings (86%) — LOW-severity `assert` hygiene, not a
  # security issue — and it buries the actionable (>=MEDIUM) findings in the report. This
  # affects report READABILITY only; the scan gates on incomplete scanners, not findings.
  # Every other Bandit rule stays active. See bandit.yaml for the rationale.
  bandit:
    options:
      config_file: bandit.yaml

  # Checkov: skip the one demo's raw Kubernetes manifests. These CKV_K8S_* findings
  # (28 of them, all under eks-investigation-devops-agent/k8s/) are on illustrative demo
  # manifests, not deployed infrastructure. Each skip_path entry is an object with a
  # `path` regex (matched against file paths) and a `reason` -- ASH v3.7.1 validates
  # skip_path as IgnorePathWithReason and rejects a bare string with a schema error.
  checkov:
    options:
      skip_path:
        - path: ".*/eks-investigation-devops-agent/k8s/.*"
          reason: "Illustrative demo Kubernetes manifests, not deployed infrastructure (CKV_K8S_*)"
