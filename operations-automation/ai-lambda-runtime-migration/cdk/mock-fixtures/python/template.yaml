AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Mock Python Lambda on a deprecated runtime (python3.9). The Runtime line below
  is what AWS Transform (AWS/python-version-upgrade) rewrites to a supported
  version, producing the diff the migration demo opens as a pull request.

Resources:
  MockPythonFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-migration-mock-python
      Handler: lambda_function.handler
      Runtime: python3.9
      MemorySize: 128
      Timeout: 10
      CodeUri: .
