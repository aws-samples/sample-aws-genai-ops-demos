AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Mock Node.js Lambda on a deprecated runtime (nodejs16.x). The Runtime line
  below is what AWS Transform (AWS/lambda-nodejs-runtime-upgrade) rewrites to a
  supported version, producing the diff the migration demo opens as a pull
  request.

Resources:
  MockNodejsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-migration-mock-nodejs
      Handler: index.handler
      Runtime: nodejs16.x
      MemorySize: 128
      Timeout: 10
      CodeUri: .
