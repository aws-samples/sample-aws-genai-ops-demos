# Demo validation contract (see contributor-guide.md, "Demo Validation").
# Validates the default variant (single). The multi-region variant is deployed
# with `./deploy-all.sh --variant multi` (see README) and is not part of this
# contract, because the schema carries one deploy command and one region.

deploy_command: ["./deploy-all.sh"]

# The demo's own script destroys the stack through the shared deploy-cdk script.
destroy_command: ["./deploy-all.sh", "--destroy"]
destroy_subdir: "."

# Region-suffixed stack ID produced by infrastructure/cdk/bin/app.ts (variant single).
stacks: ["WellArchitectedAgentReviewStack-us-east-1"]

region: "us-east-1"

verify: deterministic

notes: >
  Single-region variant (default): one stack with the deliberately non-optimized
  workload and the Well-Architected Agent profile. The agent requires a Business+ (or
  higher) Support plan in the test account and can only be hosted in us-east-1,
  us-east-2 or us-west-2. Recommendations take 24-48 hours, so CI can only check deploy
  and destroy. The admin CIDR defaults to the runner's public IPv4 (/32). To validate
  the multi-region variant by hand: ./deploy-all.sh --variant multi, then
  ./deploy-all.sh --variant multi --destroy (stacks WellArchitectedAgentReviewMultiPrimary-us-east-1,
  WellArchitectedAgentReviewMultiSecondary-us-west-2, WellArchitectedAgentReviewMultiDashboard-us-east-1).
