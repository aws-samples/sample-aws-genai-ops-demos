<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="680" viewBox="0 0 1100 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Well-Architected Agent Demo (multi-region) - Architecture</title>
  <desc>AWS CDK demo: active/active web app in us-east-1 and us-west-2. Each region has a 2-AZ VPC with no NAT gateway, an internet-facing ALB restricted to an admin CIDR, an Auto Scaling group in private subnets (deliberately confined to one AZ in the primary Region, fixed at one instance in the secondary), and VPC endpoints. A DynamoDB global table replicates between the regions; a CloudWatch dashboard in us-east-1 shows both.</desc>

