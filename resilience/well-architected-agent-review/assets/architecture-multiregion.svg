  <style>
    .lbl   { font-size: 13px; fill: #232f3e; }
    .sub   { font-size: 10.5px; fill: #5a6b7b; }
    .edge  { stroke: #5a6b7b; stroke-width: 1.6; fill: none; }
    .grp   { fill: none; stroke-width: 1.5; }
    .grptitle { font-size: 12px; font-weight: 600; }
  </style>

  <rect width="1100" height="680" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#232f3e">Well-Architected Agent Demo (multi-region) — Architecture</text>

  <!-- Admin actor and optional DNS -->
  <use href="#ic-iam" x="526" y="52" width="48" height="48"/>
  <text class="sub" x="584" y="74" fill="#DD3F5B">Admin (adminCidr)</text>
  <text class="sub" x="584" y="88">HTTP 80 / HTTPS 443</text>
  <rect class="grp" x="410" y="118" width="280" height="40" rx="6" stroke="#8C4FFF" stroke-dasharray="4 3"/>
  <text class="lbl" x="550" y="135" text-anchor="middle" font-weight="600">Route 53 DNS (optional)</text>
  <text class="sub" x="550" y="150" text-anchor="middle">records and health checks configured manually</text>
  <path class="edge" d="M550,100 L550,116" marker-end="url(#arrow)"/>

  <!-- CloudWatch dashboard (primary region, metrics from both) -->
  <use href="#ic-cw" x="24" y="56" width="44" height="44"/>
  <text class="lbl" x="78" y="74" font-weight="600">CloudWatch dashboard</text>
  <text class="sub" x="78" y="90">in us-east-1, ALB metrics from both regions</text>

  <!-- ===================== Primary region ===================== -->
  <rect class="grp" x="24" y="190" width="516" height="466" rx="8" stroke="#232f3e" stroke-dasharray="2 3"/>
  <text class="grptitle" x="40" y="212" fill="#232f3e">AWS Region · us-east-1 (primary)</text>

  <rect class="grp" x="40" y="226" width="484" height="314" rx="8" stroke="#8C4FFF"/>
  <text class="grptitle" x="56" y="246" fill="#8C4FFF">VPC 10.0.0.0/16 · no NAT gateway</text>
  <use href="#ic-vpc" x="486" y="232" width="30" height="30"/>

  <rect class="grp" x="56" y="266" width="220" height="86" rx="6" stroke="#4CA2E8" stroke-dasharray="4 3"/>
  <text class="sub" x="66" y="282" fill="#2d7fc0">Public Subnet · AZ-a</text>
  <rect class="grp" x="288" y="266" width="220" height="86" rx="6" stroke="#4CA2E8" stroke-dasharray="4 3"/>
  <text class="sub" x="298" y="282" fill="#2d7fc0">Public Subnet · AZ-b</text>
  <use href="#ic-alb" x="254" y="286" width="56" height="56"/>
  <text class="lbl" x="318" y="312" font-weight="600">ALB</text>
  <text class="sub" x="318" y="326">internet-facing, zonal shift</text>

  <rect class="grp" x="56" y="370" width="220" height="124" rx="6" stroke="#7AA116" stroke-dasharray="4 3"/>
  <text class="sub" x="66" y="386" fill="#5f7d10">Private Subnet · AZ-a</text>
  <rect class="grp" x="288" y="370" width="220" height="124" rx="6" stroke="#7AA116" stroke-dasharray="4 3"/>
  <text class="sub" x="298" y="386" fill="#5f7d10">Private Subnet · AZ-b</text>
  <rect class="grp" x="66" y="396" width="200" height="88" rx="6" stroke="#ED7100" stroke-dasharray="6 3"/>
  <use href="#ic-ec2" x="88" y="404" width="52" height="52"/>
  <use href="#ic-ec2" x="176" y="404" width="52" height="52"/>
  <text class="sub" x="76" y="476" fill="#ED7100">Auto Scaling group · EC2 t3.micro x2</text>
  <text class="sub" x="398" y="426" text-anchor="middle" style="fill:#D13212" font-weight="600">No web instances in this AZ</text>
  <text class="sub" x="398" y="442" text-anchor="middle" style="fill:#D13212">WA-ANTIPATTERN: zonal SPOF,</text>
  <text class="sub" x="398" y="456" text-anchor="middle" style="fill:#D13212">zonal shift has nowhere to go</text>

  <text class="sub" x="56" y="512">Gateway endpoints: S3, DynamoDB</text>
  <text class="sub" x="56" y="527">Interface endpoints: SSM, SSM Messages, EC2 Messages (Session Manager)</text>

  <use href="#ic-ddb" x="40" y="562" width="56" height="56"/>
  <text class="lbl" x="106" y="584" font-weight="600">DynamoDB global table</text>
  <text class="sub" x="106" y="600">replica · on-demand · PITR</text>

  <!-- ===================== Secondary region ===================== -->
  <rect class="grp" x="560" y="190" width="516" height="466" rx="8" stroke="#232f3e" stroke-dasharray="2 3"/>
  <text class="grptitle" x="576" y="212" fill="#232f3e">AWS Region · us-west-2 (secondary)</text>

  <rect class="grp" x="576" y="226" width="484" height="314" rx="8" stroke="#8C4FFF"/>
  <text class="grptitle" x="592" y="246" fill="#8C4FFF">VPC 10.1.0.0/16 · no NAT gateway</text>
  <use href="#ic-vpc" x="1022" y="232" width="30" height="30"/>

  <rect class="grp" x="592" y="266" width="220" height="86" rx="6" stroke="#4CA2E8" stroke-dasharray="4 3"/>
  <text class="sub" x="602" y="282" fill="#2d7fc0">Public Subnet · AZ-a</text>
  <rect class="grp" x="824" y="266" width="220" height="86" rx="6" stroke="#4CA2E8" stroke-dasharray="4 3"/>
  <text class="sub" x="834" y="282" fill="#2d7fc0">Public Subnet · AZ-b</text>
  <use href="#ic-alb" x="790" y="286" width="56" height="56"/>
  <text class="lbl" x="854" y="312" font-weight="600">ALB</text>
  <text class="sub" x="854" y="326">internet-facing, zonal shift</text>

  <rect class="grp" x="592" y="370" width="220" height="124" rx="6" stroke="#7AA116" stroke-dasharray="4 3"/>
  <text class="sub" x="602" y="386" fill="#5f7d10">Private Subnet · AZ-a</text>
  <rect class="grp" x="824" y="370" width="220" height="124" rx="6" stroke="#7AA116" stroke-dasharray="4 3"/>
  <text class="sub" x="834" y="386" fill="#5f7d10">Private Subnet · AZ-b</text>
  <rect class="grp" x="646" y="396" width="344" height="88" rx="6" stroke="#ED7100" stroke-dasharray="6 3"/>
  <use href="#ic-ec2" x="676" y="404" width="52" height="52"/>
  <text class="sub" x="660" y="468" fill="#ED7100">Auto Scaling group</text>
  <text class="sub" x="660" y="480" fill="#ED7100">EC2 t3.micro x1</text>
  <text class="sub" x="908" y="426" text-anchor="middle" style="fill:#D13212" font-weight="600">Fixed: min = max = 1</text>
  <text class="sub" x="908" y="442" text-anchor="middle" style="fill:#D13212">WA-ANTIPATTERN: cannot absorb</text>
  <text class="sub" x="908" y="456" text-anchor="middle" style="fill:#D13212">the primary's traffic on failover</text>

  <text class="sub" x="592" y="512">Gateway endpoints: S3, DynamoDB</text>
  <text class="sub" x="592" y="527">Interface endpoints: SSM, SSM Messages, EC2 Messages (Session Manager)</text>

  <use href="#ic-ddb" x="576" y="562" width="56" height="56"/>
  <text class="lbl" x="642" y="584" font-weight="600">DynamoDB global table</text>
  <text class="sub" x="642" y="600">replica · on-demand · PITR</text>

  <!-- ===================== Edges ===================== -->
  <!-- DNS -> ALBs -->
  <path class="edge" d="M430,158 C380,200 300,230 282,284" marker-end="url(#arrow)"/>
  <path class="edge" d="M670,158 C720,200 800,230 818,284" marker-end="url(#arrow)"/>
  <!-- ALB -> ASG (HTTP 80, security group reference) -->
  <path class="edge" d="M282,344 L282,361 L252,361 L252,394" marker-end="url(#arrow)"/>
  <path class="edge" d="M818,344 L818,394" marker-end="url(#arrow)"/>
  <!-- Web tier -> local DynamoDB replica via gateway endpoint -->
  <path class="edge" d="M88,430 L48,430 L48,560" marker-end="url(#arrow)"/>
  <path class="edge" d="M676,430 L584,430 L584,560" marker-end="url(#arrow)"/>
  <!-- Bidirectional global table replication -->
  <path class="edge" d="M300,592 L574,592" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="sub" x="437" y="584" text-anchor="middle">active/active replication</text>
</svg>
