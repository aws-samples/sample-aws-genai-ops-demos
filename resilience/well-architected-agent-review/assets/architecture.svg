  <title>Well-Architected Agent Demo - Architecture</title>
  <desc>AWS CDK demo: single EC2 app instance, single-AZ RDS MySQL, private S3 bucket, Secrets Manager credentials, admin-restricted security group, in a 2-AZ VPC.</desc>

