AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AI Load Test Generator Agent on Amazon Bedrock AgentCore Runtime.
  Builds the agent container in-stack (CodeBuild + custom resource) and creates a
  dedicated private S3 bucket for swagger/OpenAPI spec input.
  Inbound is private (IAM SigV4) regardless of NetworkMode. NetworkMode=public
  (default) uses AWS-managed egress; NetworkMode=vpc places the runtime in a
  private VPC with egress via endpoints. Least-privilege execution role.

# ---------------------------------------------------------------------------
# NOTE ON SCOPE
#   NetworkMode=public (default) creates NO VPC resources. NetworkMode=vpc with
#   CreateVpc=true implements the NEW-VPC path fully; the existing-VPC path
#   (CreateVpc=false) is parameterized but expects the required interface/
#   gateway VPC endpoints to already exist in that VPC (see README/spec §6.4).
# ---------------------------------------------------------------------------

Parameters:
  # --- source / build (Form B) ---------------------------------------------
  ArtifactBucketName:
    Type: String
    Description: >-
      S3 bucket holding the agent source zip that CodeBuild builds. Created and
      populated by infrastructure/cloudformation/deploy.sh BEFORE stack deploy (the OSS swap point in
      CodeBuildProject removes this once the repo is a public git source).
  SourceS3Key:
    Type: String
    Description: S3 key (in ArtifactBucketName) of the agent source zip CodeBuild builds.
  ImageTag:
    Type: String
    Description: >-
      ECR image tag to build/deploy (e.g. git-<sha>). Changing this (together
      with SourceS3Key) retriggers the build via the custom resource.

  # --- DLT / Bedrock wiring -------------------------------------------------
  # DLT is OPTIONAL: the agent's core job is generating test scripts (jmx/k6/
  # locust). Wiring it to a DLT stack (to launch real load tests) is opt-in.
  # Leave all Dlt* params empty to deploy a script-only agent; supply them (or
  # re-run deploy.sh with --dlt-stack later) to connect DLT. When empty, the
  # DLT-scoped IAM statements are omitted entirely (least privilege).
  DltStackName:
    Type: String
    Default: ""
    Description: DLT CloudFormation stack name (agent reads its outputs). Empty = DLT not connected.
  DltRegion:
    Type: String
    Default: ""
    Description: Region of the DLT stack / API / scenarios bucket. Empty = DLT not connected.
  BedrockRegion:
    Type: String
    Description: Region where Bedrock models are invoked (drives CRIS prefix).
  DltApiGatewayArn:
    Type: String
    Default: ""
    Description: >-
      execute-api ARN scope for the DLT API, e.g.
      arn:aws:execute-api:us-east-2:111122223333:abc123/*/*/* . Empty = DLT not connected.
  DltScenariosBucketArn:
    Type: String
    Default: ""
    Description: ARN of the DLT scenarios bucket (script upload target). Empty = DLT not connected.
  DltStackArn:
    Type: String
    Default: ""
    Description: ARN of the DLT CloudFormation stack (DescribeStacks scope). Empty = DLT not connected.
  BedrockInferenceProfileArns:
    Type: CommaDelimitedList
    Description: Inference profile ARNs the agent may invoke (opus/sonnet CRIS).
  BedrockModelPrimary:
    Type: String
    Default: ""
    Description: >-
      Primary model/inference-profile id the agent invokes (sets
      BEDROCK_MODEL_PRIMARY). Empty = agent's built-in default. Must be one of
      the ids covered by BedrockInferenceProfileArns so IAM allows the invoke.
  BedrockModelFallback:
    Type: String
    Default: ""
    Description: >-
      Fallback model/inference-profile id (sets BEDROCK_MODEL_FALLBACK). Empty =
      agent's built-in default. Must also be covered by BedrockInferenceProfileArns.

  # --- networking -----------------------------------------------------------
  NetworkMode:
    Type: String
    AllowedValues: ["public", "vpc"]
    Default: "public"
    Description: >-
      Runtime network placement. "public" (default) creates NO VPC and runs the
      runtime with AWS-managed egress — lightweight, no NAT/endpoint cost and no
      service-managed ENIs that linger up to ~8h on delete. "vpc" places the
      runtime ENIs in a private VPC (NAT + interface/S3 endpoints + egress-only
      SG) for egress control, private AWS-service traffic, and reaching
      private/internal test targets. Inbound is IAM SigV4 in BOTH modes; PUBLIC
      does not expose an inbound endpoint.
  CreateVpc:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Only applies when NetworkMode=vpc. Create a new VPC (true) or use an
      existing one (false).
  ExistingVpcId:
    Type: String
    Default: ""
    Description: Existing VPC id (when CreateVpc=false).
  ExistingPrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Existing private subnet ids (when CreateVpc=false).
  VpcCidr:
    Type: String
    Default: "10.60.0.0/16"
  PrivateSubnetACidr:
    Type: String
    Default: "10.60.0.0/20"
  PrivateSubnetBCidr:
    Type: String
    Default: "10.60.16.0/20"
  PublicSubnetCidr:
    Type: String
    Default: "10.60.240.0/24"
    Description: Small public subnet that hosts only the NAT gateway (egress).
  S3PrefixListId:
    Type: String
    Default: ""
    Description: >-
      AWS-managed S3 prefix list id for this region (pl-xxxx), used for the
      runtime SG egress rule to reach the S3 gateway endpoint. Look up with:
      aws ec2 describe-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.<region>.s3
  EnableXrayTracing:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      Grant the execution role X-Ray permissions for OTEL span/trace export.
      Set to "true" ONLY when CloudWatch Transaction Search is enabled in this
      account/region; otherwise span export 400s and the perms are unusable.
      X-Ray actions cannot be resource-scoped, so gating them here keeps the
      role least-privilege when tracing is not in use.

Conditions:
  IsVpc: !Equals [!Ref NetworkMode, "vpc"]
  # New VPC is created only in vpc mode with CreateVpc=true. In public mode NO
  # VPC/NAT/IGW/endpoint/SG resources are created at all.
  DoCreateVpc: !And [!Condition IsVpc, !Equals [!Ref CreateVpc, "true"]]
  HaveS3PrefixList: !Not [!Equals [!Ref S3PrefixListId, ""]]
  # Runtime SG egress to the S3 gateway prefix list: needs both vpc mode (the SG
  # exists) and a supplied prefix list id.
  RuntimeS3Egress: !And [!Condition IsVpc, !Condition HaveS3PrefixList]
  WithXray: !Equals [!Ref EnableXrayTracing, "true"]
  # DLT is connected only when a stack name was supplied. Gates the DLT-scoped
  # IAM statements so a script-only deploy carries no dangling DLT permissions.
  HasDlt: !Not [!Equals [!Ref DltStackName, ""]]

Resources:

  # =========================================================================
  # Form A — swagger/OpenAPI spec input bucket (private)
  # =========================================================================
  SpecInputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-spec-inputs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }

  SpecInputBucketTlsOnlyPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpecInputBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SpecInputBucket.Arn
              - !Sub "${SpecInputBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # Script-output bucket (private). The agent uploads generated scripts here on
  # request so the user can retrieve them; the build tools otherwise write only
  # to the container's /tmp. SSE-S3 (AES256) so a plain s3:PutObject needs no
  # extra kms:GenerateDataKey grant on the runtime role.
  ScriptOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-generated-scripts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }

  ScriptOutputBucketTlsOnlyPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScriptOutputBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ScriptOutputBucket.Arn
              - !Sub "${ScriptOutputBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # =========================================================================
  # Container image: ECR + CodeBuild (ARM64) + custom resource trigger
  # =========================================================================
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-and-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"   # GetAuthorizationToken cannot be resource-scoped
              - Sid: EcrPushThisRepoOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt EcrRepository.Arn
              - Sid: SourceRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${SourceS3Key}"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      # Reuse the heavy base layers (openjdk + JMeter download + pip install)
      # across builds so a rebuild is ~1-2 min instead of a cold ~7-14 min.
      # A slow uncached JMeter download once overran the custom-resource wait
      # (<=900s Lambda cap) and rolled the stack back.
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_SOURCE_CACHE
      # ┌───────────────────────────────────────────────────────────────────┐
      # │ OSS SWAP POINT — the ONLY block that changes when this repo goes    │
      # │ public on GitHub. Today: S3 source uploaded by infrastructure/cloudformation/deploy.sh    │
      # │ before deploy. OSS: replace with                                    │
      # │   Type: NO_SOURCE   +   a buildspec whose pre_build does            │
      # │   `git clone --depth 1 --branch $GIT_REF $GIT_REPO_URL src`         │
      # │ then no bucket / no pre-upload step is needed at all.               │
      # └───────────────────────────────────────────────────────────────────┘
      Source:
        Type: S3
        Location: !Sub "${ArtifactBucketName}/${SourceS3Key}"
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            build:
              commands:
                - docker build --platform linux/arm64 -t "$ECR_URI:$IMAGE_TAG" .
            post_build:
              commands:
                - docker push "$ECR_URI:$IMAGE_TAG"
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true            # required for docker build
        EnvironmentVariables:
          - { Name: ECR_URI, Value: !GetAtt EcrRepository.RepositoryUri }
          - { Name: ECR_REGISTRY, Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" }
          - { Name: IMAGE_TAG, Value: !Ref ImageTag }
      TimeoutInMinutes: 20

  ImageBuildFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: drive-codebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  ImageBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt ImageBuildFunctionRole.Arn
      # Inlined (no `package` step, no bucket for the Lambda). boto3 + urllib
      # ship with the python3.12 runtime. Kept small on purpose (<4096 chars).
      Code:
        ZipFile: |
          import json, time, urllib.request, boto3
          cb = boto3.client("codebuild")
          POLL, MAXW = 15, 840

          def _send(event, context, status, reason, pid):
              body = json.dumps({
                  "Status": status, "Reason": reason,
                  "PhysicalResourceId": pid or context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": {},
              }).encode()
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req, timeout=30)

          def handler(event, context):
              rt = event["RequestType"]
              props = event.get("ResourceProperties", {})
              pid = event.get("PhysicalResourceId")
              try:
                  if rt == "Delete":
                      return _send(event, context, "SUCCESS", "delete no-op", pid)
                  bid = cb.start_build(projectName=props["ProjectName"])["build"]["id"]
                  deadline = time.time() + MAXW
                  info = None
                  while time.time() < deadline:
                      time.sleep(POLL)
                      info = cb.batch_get_builds(ids=[bid])["builds"][0]
                      if info["buildStatus"] != "IN_PROGRESS":
                          break
                  else:
                      return _send(event, context, "FAILED",
                                   f"build {bid} timed out after {MAXW}s", bid)
                  st = info["buildStatus"]
                  ok = st == "SUCCEEDED"
                  _send(event, context, "SUCCESS" if ok else "FAILED",
                        f"build {bid} status {st}", bid)
              except Exception as exc:
                  _send(event, context, "FAILED", f"{type(exc).__name__}: {exc}", pid)

  ImageBuild:
    Type: Custom::ImageBuild
    Properties:
      ServiceToken: !GetAtt ImageBuildFunction.Arn
      ProjectName: !Ref CodeBuildProject
      # SourceHash retriggers the build whenever the source zip / tag changes.
      SourceHash: !Ref SourceS3Key
      ImageTag: !Ref ImageTag

  # =========================================================================
  # Runtime execution role — least privilege (spec §5)
  # =========================================================================
  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: agent-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - HasDlt
                - Sid: DltApiInvoke
                  Effect: Allow
                  Action: execute-api:Invoke
                  Resource: !Ref DltApiGatewayArn   # scope covers POST /scenarios, GET|POST /scenarios/*, GET /regions
                - !Ref "AWS::NoValue"
              - Sid: BedrockInvoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Ref BedrockInferenceProfileArns
              - !If
                - HasDlt
                - Sid: DltDescribeStack
                  Effect: Allow
                  Action: cloudformation:DescribeStacks
                  Resource: !Ref DltStackArn
                - !Ref "AWS::NoValue"
              - !If
                - HasDlt
                - Sid: DltScenariosBucketWrite
                  Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject   # upload_script does head_object after upload
                  Resource: !Sub "${DltScenariosBucketArn}/public/test-scenarios/*"
                - !Ref "AWS::NoValue"
              - Sid: SpecInputRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${SpecInputBucket.Arn}/*"
              - Sid: ScriptOutputWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject   # GetObject lets the agent presign a retrieval URL
                Resource: !Sub "${ScriptOutputBucket.Arn}/*"
              # --- AgentCore runtime platform baseline (required by the runtime
              #     itself; without these a session fails to pull the image / log) ---
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt EcrRepository.Arn
              - Sid: EcrAuthToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                # IAM does not support resource-level scoping for this action —
                # "*" is the only valid form. The actual image pull is scoped to
                # this repo via EcrPull (BatchGetImage/GetDownloadUrlForLayer).
                Resource: "*"
              - Sid: RuntimeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - !If
                - WithXray
                - Sid: Xray
                  Effect: Allow
                  Action:
                    - xray:PutTraceSegments
                    - xray:PutTelemetryRecords
                    - xray:GetSamplingRules
                    - xray:GetSamplingTargets
                  # X-Ray actions do not support resource-level scoping — "*" is
                  # required. Only included when EnableXrayTracing=true (i.e.
                  # CloudWatch Transaction Search is enabled).
                  Resource: "*"
                - !Ref "AWS::NoValue"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: { "cloudwatch:namespace": "bedrock-agentcore" }
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*"

  # =========================================================================
  # AgentCore Runtime (NetworkMode public|vpc; IAM SigV4 inbound in both)
  # =========================================================================
  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    DependsOn: ImageBuild
    Properties:
      AgentRuntimeName: ai_load_test_gen
      RoleArn: !GetAtt RuntimeExecutionRole.Arn
      ProtocolConfiguration: HTTP
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub "${EcrRepository.RepositoryUri}:${ImageTag}"
      NetworkConfiguration: !If
        - IsVpc
        - NetworkMode: VPC
          NetworkModeConfig:
            SecurityGroups: [!Ref RuntimeSecurityGroup]
            Subnets: !If
              - DoCreateVpc
              - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
              - !Ref ExistingPrivateSubnetIds
        - NetworkMode: PUBLIC
      EnvironmentVariables:
        DLT_STACK_NAME: !Ref DltStackName
        DLT_REGION: !Ref DltRegion
        BEDROCK_REGION: !Ref BedrockRegion
        BEDROCK_MODEL_PRIMARY: !Ref BedrockModelPrimary
        BEDROCK_MODEL_FALLBACK: !Ref BedrockModelFallback
        SPEC_INPUT_BUCKET: !Ref SpecInputBucket
        SCRIPT_OUTPUT_BUCKET: !Ref ScriptOutputBucket

  # =========================================================================
  # Networking (new-VPC path)
  # =========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Condition: DoCreateVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: DoCreateVpc
    Properties: { VpcId: !Ref Vpc }

  RouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: DoCreateVpc
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }

  RouteTableAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: DoCreateVpc
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # --- Egress to the internet (NAT) -----------------------------------------
  # The DLT REST API is a public EDGE API and load-test targets are public, so
  # the runtime needs outbound internet. This is EGRESS ONLY: a NAT gateway in a
  # public subnet + IGW. There is NO inbound path from the internet to the
  # runtime ENIs (the runtime SG has no ingress), so §1 "no public inbound"
  # still holds.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: DoCreateVpc

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: DoCreateVpc
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false   # only the NAT GW (with its EIP) lives here

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: DoCreateVpc
    Properties: { VpcId: !Ref Vpc }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: DoCreateVpc
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: DoCreateVpc
    Properties: { SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRouteTable }

  NatEip:
    Type: AWS::EC2::EIP
    Condition: DoCreateVpc
    DependsOn: IgwAttachment
    Properties: { Domain: vpc }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: DoCreateVpc
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: DoCreateVpc
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # Runtime ENI SG: no inbound; egress only to the endpoint SG on 443.
  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsVpc
    Properties:
      GroupDescription: AgentCore runtime ENIs - egress to VPC endpoints only
      VpcId: !If [DoCreateVpc, !Ref Vpc, !Ref ExistingVpcId]

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DoCreateVpc
    Properties:
      GroupDescription: Interface VPC endpoints - 443 from the runtime SG only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref RuntimeSecurityGroup

  RuntimeSgEgressToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: DoCreateVpc
    Properties:
      GroupId: !Ref RuntimeSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup

  # Egress to the public internet (via NAT) for the DLT EDGE API and the
  # external load-test targets that validate_script / DLT tasks must reach.
  # Egress only — no inbound rule exists on this SG.
  RuntimeSgEgressToInternet:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: DoCreateVpc
    Properties:
      GroupId: !Ref RuntimeSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  # S3 access is via the gateway endpoint, whose route targets the S3-managed
  # prefix list. SG egress to S3 must reference that prefix list id — there is
  # no CFN intrinsic for the AWS-managed S3 prefix list, so it is passed in as
  # a parameter (aws ec2 describe-prefix-lists --filters
  # Name=prefix-list-name,Values=com.amazonaws.<region>.s3).
  RuntimeSgEgressToS3:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: RuntimeS3Egress
    Properties:
      GroupId: !Ref RuntimeSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3PrefixListId

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # Interface endpoints for agent egress + AgentCore service plane.
  # ⚠️ The exact service-plane set required in VPC mode is confirmed at deploy.
  InterfaceEndpoints:
    Type: AWS::EC2::VPCEndpoint
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  CfnEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.cloudformation"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # Required for VPC (no-internet) mode: the microVM pulls the container image
  # from ECR (layers stored in S3, covered by the S3 gateway endpoint) and
  # writes runtime logs to CloudWatch. Without these the session start fails to
  # pull the image -> 502 with no app logs.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: DoCreateVpc
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

Outputs:
  AgentRuntimeArn:
    Description: ARN of the AgentCore runtime (use with InvokeAgentRuntime).
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
  ScriptOutputBucketName:
    Description: Generated scripts are uploaded here on request; retrieve with aws s3 cp.
    Value: !Ref ScriptOutputBucket
  SpecInputBucketName:
    Description: Upload swagger/OpenAPI here; reference its s3:// URI in the invoke prompt.
    Value: !Ref SpecInputBucket
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  RuntimeExecutionRoleArn:
    Value: !GetAtt RuntimeExecutionRole.Arn
